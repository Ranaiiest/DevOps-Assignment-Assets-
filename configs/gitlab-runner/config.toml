# /etc/gitlab-runner/config.toml (sanitized on gitlab)
concurrent = 1
check_interval = 0
connection_max_age = "15m0s"
shutdown_timeout = 0

[session_server]
  session_timeout = 1800

[[runners]]
  environment = ["GIT_SSL_NO_VERIFY=true"]
  name = "private-docker-runner"
  url = "https://gitlab.company.local"
  id = 1
  token = "<GITLAB_RUNNER_AUTH_TOKEN>"
  tls-ca-file = "/etc/gitlab/ssl/gitlab.company.local.crt"
  executor = "docker"
  [runners.docker]
    extra_hosts = ["gitlab.company.local:172.28.10.10"]
    pull_policy = ["if-not-present"]
    tls_verify = false
    image = "alpine:latest"
    privileged = false
    disable_entrypoint_overwrite = false
    oom_kill_disable = false
    disable_cache = false
    volumes = ["/cache"]
    shm_size = 0
    network_mtu = 0
