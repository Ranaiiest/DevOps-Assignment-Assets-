# /etc/wireguard/dev1.conf (on client)
# Use the same structure for dev2.conf (172.28.20.3/24) and admin.conf (172.28.20.10/24).
# Split-tunnel AllowedIPs routes only VPN and private-subnet traffic through vpn-gw.

[Interface]
Address = 172.28.20.2/24
PrivateKey = <DEV1_PRIVATE_KEY>

[Peer]
PublicKey = <VPN_GW_SERVER_PUBLIC_KEY>
Endpoint = <VPN_GW_OUTER_IP>:51820
AllowedIPs = 172.28.20.0/24, 172.28.10.0/24
PersistentKeepalive = 25
