# /etc/wireguard/wg0.conf (on vpn-gw)
# All real private/public keys replaced with placeholders.

[Interface]
Address = 172.28.20.1/24
ListenPort = 51820
PrivateKey = <VPN_GW_SERVER_PRIVATE_KEY>

[Peer]
# dev1
PublicKey = <DEV1_PUBLIC_KEY>
AllowedIPs = 172.28.20.2/32

[Peer]
# dev2
PublicKey = <DEV2_PUBLIC_KEY>
AllowedIPs = 172.28.20.3/32

[Peer]
# admin
PublicKey = <ADMIN_PUBLIC_KEY>
AllowedIPs = 172.28.20.10/32
